name: build-dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      DOBBY_VERSION: "1.3.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =====================================================================
      # 1. DOBBY
      # =====================================================================
      - name: Clone Dobby
        run: |
          git clone https://github.com/jmpews/Dobby.git --depth=1 -b ${DOBBY_VERSION} dobby-src || \
          git clone https://github.com/jmpews/Dobby.git --depth=1 dobby-src
          cd dobby-src
          git submodule update --init --recursive || true
          git log -1 --oneline
          ls -la

      - name: Build Dobby (iOS arm64 static, Makefile generator)
        run: |
          cd dobby-src
          mkdir -p build-ios-arm64 && cd build-ios-arm64
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DDynamicBinaryInstrument=ON \
            -DNearBranch=ON \
            -DPlugin.SymbolResolver=ON \
            -DPlugin.Darwin.HideLibrary=ON \
            -DPlugin.Darwin.ObjectiveC=ON \
            -DDOBBY_BUILD_EXAMPLE=OFF \
            -DDOBBY_BUILD_TEST=OFF
          make -j$(sysctl -n hw.ncpu)
          echo "=== built artifacts ==="
          find . -name "libdobby.a" -o -name "*.dylib" | head
          mkdir -p ../../dobby-out
          cp $(find . -name "libdobby.a" | head -1) ../../dobby-out/ || true
          cp -R ../include ../../dobby-out/ 2>/dev/null || true

      - name: Verify Dobby artifacts
        run: |
          ls -la dobby-out
          file dobby-out/libdobby.a || echo "no libdobby.a"
          lipo -info dobby-out/libdobby.a || true

      # =====================================================================
      # 2. CERT DEBUG + IMPORT
      # =====================================================================
      - name: Debug cert secret
        if: env.HAS_CERT == 'true'
        env:
          HAS_CERT: ${{ secrets.SIGNING_CERT_P12 != '' }}
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          set -x
          echo "secret length: ${#SIGNING_CERT_P12}"
          echo "last 4 chars: ${SIGNING_CERT_P12: -4}"
          echo -n "$SIGNING_CERT_P12" | base64 --decode > /tmp/cert.p12
          echo "decoded size: $(wc -c < /tmp/cert.p12)"
          file /tmp/cert.p12
          xxd /tmp/cert.p12 | head -3
          openssl pkcs12 -info -in /tmp/cert.p12 -noout \
            -passin pass:"$SIGNING_CERT_PASSWORD" 2>&1 | head -10

      - name: Import signing cert
        if: env.HAS_CERT == 'true'
        env:
          HAS_CERT: ${{ secrets.SIGNING_CERT_P12 != '' }}
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          LEGACY_PATH=$RUNNER_TEMP/cert-legacy.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # decode
          echo -n "$SIGNING_CERT_P12" | base64 --decode -o "$CERT_PATH"
          SIZE=$(wc -c < "$CERT_PATH")
          echo "decoded cert size: $SIZE"
          if [ "$SIZE" -lt 100 ]; then
            echo "::error::Decoded .p12 is too small ($SIZE bytes) — secret is empty, truncated, or not base64"
            exit 1
          fi

          # verify magic bytes: PKCS#12 starts with 0x30 0x82
          FIRST=$(xxd -p -l 2 "$CERT_PATH")
          if [ "$FIRST" != "3082" ]; then
            echo "::error::File does not start with 30 82 (got $FIRST) — not a PKCS#12"
            echo "::error::Did you export a .p12 from Keychain, or just paste a .cer/.pem?"
            exit 1
          fi

          # verify password opens the p12
          if ! openssl pkcs12 -in "$CERT_PATH" -out /tmp/cert.pem -nodes \
                 -passin pass:"$SIGNING_CERT_PASSWORD" 2>/tmp/p12.err; then
            echo "::error::openssl cannot open the .p12 — password mismatch or unsupported format"
            cat /tmp/p12.err
            exit 1
          fi
          echo "::notice::.p12 password verified OK"

          # convert to legacy PBE (macOS security import can't read AES-256 PBE)
          openssl pkcs12 -export -in /tmp/cert.pem -out "$LEGACY_PATH" \
            -passout pass:"$SIGNING_CERT_PASSWORD" \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1

          # create temp keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # import legacy p12
          if ! security import "$LEGACY_PATH" \
                 -P "$SIGNING_CERT_PASSWORD" \
                 -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"; then
            echo "::error::security import failed — see error above"
            exit 1
          fi

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning

      # =====================================================================
      # 3. BUILD DYLIB
      # =====================================================================
      - name: Compile libRbxHook.dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -o libRbxHook.dylib libRbxHook.c \
            -framework Foundation -framework UIKit \
            -fobjc-arc -mios-version-min=15.0 \
            -I dobby-out/include \
            -L dobby-out -lDobby \
            -isysroot "$SDK"

      - name: Show linked libraries
        run: otool -L libRbxHook.dylib

      - name: Verify dylib arch
        run: |
          lipo -info libRbxHook.dylib
          file libRbxHook.dylib

      # =====================================================================
      # 4. STRIP + SIGN
      # =====================================================================
      - name: Strip debug symbols
        run: xcrun -sdk iphoneos strip -x libRbxHook.dylib || true

      - name: Sign dylib
        if: env.HAS_CERT == 'true'
        env:
          HAS_CERT: ${{ secrets.SIGNING_CERT_P12 != '' }}
          CERT_NAME: ${{ secrets.SIGNING_CERT_NAME }}
        run: |
          codesign -s "$CERT_NAME" --force --timestamp=none \
            --preserve-metadata=identifier,entitlements libRbxHook.dylib
          codesign -dv --verbose=4 libRbxHook.dylib || true

      # =====================================================================
      # 5. UPLOAD
      # =====================================================================
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: libRbxHook
          path: |
            libRbxHook.dylib
            dobby-out/libdobby.a
          retention-days: 30
          if-no-files-found: error

      - name: Upload debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            /tmp/cert.p12
            /tmp/cert.pem
            /tmp/p12.err
          retention-days: 3
          if-no-files-found: ignore

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/app-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          fi
          rm -f /tmp/cert.p12 /tmp/cert.pem /tmp/p12.err "$RUNNER_TEMP/cert-legacy.p12" || true
