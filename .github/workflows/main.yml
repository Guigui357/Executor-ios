name: build-dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      DOBBY_VERSION: "1.3.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =====================================================================
      # 1. BUILD DOBBY
      # =====================================================================
      - name: Clone Dobby
        run: |
          git clone https://github.com/jmpews/Dobby.git --depth=1 -b ${DOBBY_VERSION} dobby-src || \
          git clone https://github.com/jmpews/Dobby.git --depth=1 dobby-src
          cd dobby-src
          git submodule update --init --recursive || true
          git log -1 --oneline
          ls -la

      - name: Build Dobby (iOS arm64 static, Makefile generator)
        run: |
          cd dobby-src
          mkdir -p build-ios-arm64 && cd build-ios-arm64
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DDynamicBinaryInstrument=ON \
            -DNearBranch=ON \
            -DPlugin.SymbolResolver=ON \
            -DPlugin.Darwin.HideLibrary=ON \
            -DPlugin.Darwin.ObjectiveC=ON \
            -DDOBBY_BUILD_EXAMPLE=OFF \
            -DDOBBY_BUILD_TEST=OFF
          make -j$(sysctl -n hw.ncpu)
          echo "=== built artifacts ==="
          find . -name "libdobby.a" -o -name "*.dylib" | head
          mkdir -p ../../dobby-out
          cp $(find . -name "libdobby.a" | head -1) ../../dobby-out/ || true
          cp -R ../include ../../dobby-out/ 2>/dev/null || true

      - name: Verify Dobby artifacts
        run: |
          ls -la dobby-out
          file dobby-out/libdobby.a || echo "no libdobby.a"
          lipo -info dobby-out/libdobby.a || true

      # =====================================================================
      # 2. DECODE + VERIFY CERT
      # =====================================================================
      - name: Decode certificate secret
        if: env.HAS_CERT == 'true'
        env:
          HAS_CERT: ${{ secrets.SIGNING_CERT_P12 != '' }}
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
        run: |
          set -e
          printf '%s' "$SIGNING_CERT_P12" > /tmp/cert.b64
          LEN=$(wc -c < /tmp/cert.b64 | tr -d ' ')
          echo "b64 length: $LEN"
          echo "last 4: '$(tail -c 4 /tmp/cert.b64)'"
          if [ "$LEN" -ne 4336 ]; then
            echo "::error::base64 secret is $LEN chars, expected 4336"
            exit 1
          fi
          base64 -D -i /tmp/cert.b64 -o /tmp/cert.p12
          SIZE=$(wc -c < /tmp/cert.p12 | tr -d ' ')
          echo "decoded size: $SIZE"
          file /tmp/cert.p12
          xxd /tmp/cert.p12 | head -2
          if [ "$SIZE" -ne 3251 ]; then
            echo "::error::decoded p12 is $SIZE bytes, expected 3251"
            exit 1
          fi
          echo "::notice::cert secret OK ($LEN chars -> $SIZE bytes)"

      # =====================================================================
      # 3. IMPORT CERT
      # =====================================================================
      - name: Import signing cert
        if: env.HAS_CERT == 'true'
        env:
          HAS_CERT: ${{ secrets.SIGNING_CERT_P12 != '' }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          CERT_PATH=/tmp/cert.p12
          LEGACY_PATH=$RUNNER_TEMP/cert-legacy.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Verify password with openssl
          if ! openssl pkcs12 -in "$CERT_PATH" -out /tmp/cert.pem -nodes \
                 -passin pass:"$SIGNING_CERT_PASSWORD" 2>/tmp/p12.err; then
            echo "::error::openssl cannot open the .p12"
            cat /tmp/p12.err
            exit 1
          fi
          echo "::notice::password verified"

          # Convert to legacy PBE (macOS security import cannot read AES-256 PBE)
          openssl pkcs12 -export -in /tmp/cert.pem -out "$LEGACY_PATH" \
            -passout pass:"$SIGNING_CERT_PASSWORD" \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1

          # Import to temp keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$LEGACY_PATH" -P "$SIGNING_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning

      # =====================================================================
      # 4. BUILD DYLIB
      # =====================================================================
      - name: Compile libRbxHook.dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -o libRbxHook.dylib libRbxHook.c \
            -framework Foundation -framework UIKit \
            -fobjc-arc -mios-version-min=15.0 \
            -I dobby-out/include \
            -L dobby-out -lDobby \
            -isysroot "$SDK"

      - name: Verify dylib
        run: |
          otool -L libRbxHook.dylib
          lipo -info libRbxHook.dylib
          file libRbxHook.dylib

      # =====================================================================
      # 5. STRIP + SIGN
      # =====================================================================
      - name: Strip debug symbols
        run: xcrun -sdk iphoneos strip -x libRbxHook.dylib || true

      - name: Sign dylib
        if: env.HAS_CERT == 'true'
        env:
          HAS_CERT: ${{ secrets.SIGNING_CERT_P12 != '' }}
          CERT_NAME: ${{ secrets.SIGNING_CERT_NAME }}
        run: |
          set -e
          codesign -s "$CERT_NAME" --force --timestamp=none \
            --preserve-metadata=identifier,entitlements libRbxHook.dylib
          codesign -dv --verbose=4 libRbxHook.dylib

      # =====================================================================
      # 6. UPLOAD
      # =====================================================================
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: libRbxHook
          path: |
            libRbxHook.dylib
            dobby-out/libdobby.a
          retention-days: 30
          if-no-files-found: error

      - name: Upload debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            /tmp/cert.b64
            /tmp/cert.p12
            /tmp/cert.pem
            /tmp/p12.err
          retention-days: 3
          if-no-files-found: ignore

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/app-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          fi
          rm -f /tmp/cert.b64 /tmp/cert.p12 /tmp/cert.pem /tmp/p12.err \
                "$RUNNER_TEMP/cert-legacy.p12" || true
