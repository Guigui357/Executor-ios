name: Build iOS Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clone and Build Dobby for iOS
      run: |
        git clone --depth 1 https://github.com/jmpews/Dobby.git
        cd Dobby
        mkdir build_ios && cd build_ios
        cmake .. \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
          -DCMAKE_BUILD_TYPE=Release \
          -DDOBBY_GENERATE_SHARED=OFF
        make -j$(sysctl -n hw.ncpu)

    - name: Compile libRbxHook.dylib
      run: |
        xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
          -o libRbxHook.dylib libRbxHook.m \
          -framework Foundation -framework UIKit \
          -fobjc-arc -mios-version-min=15.0 \
          -I Dobby/include \
          -L Dobby/build_ios -ldobby

    - name: Sign Dylib (Ldid)
      run: |
        brew install ldid
        ldid -S libRbxHook.dylib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libRbxHook-dylib
        path: libRbxHook.dylib
